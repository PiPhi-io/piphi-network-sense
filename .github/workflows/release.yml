name: Publish Sense release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag matching manifest.version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sense-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Validate inputs and Docker Hub configuration
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be an existing version tag such as v0.1.0"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_OIDC_CONNECTIONID" ]]; then
            echo "::error::Configure the DOCKERHUB_OIDC_CONNECTIONID GitHub Actions variable at the organization, repository, or release-environment level"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version and image consistency
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: python scripts/check_release.py "$RELEASE_REF"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/validate.py
      - name: Build and validate dashboard widgets
        run: |
          for widget in sense-energy-flow sense-device-breakdown; do
            (
              cd "widgets/$widget"
              npm ci --ignore-scripts
              npm run build
              npm test
              npm run conformance
            )
          done
      - name: Smoke-test the runtime image before publishing
        run: |
          docker build -t sense-release-smoke .
          docker run --rm --network none sense-release-smoke python -c '
          from pathlib import Path
          from piphi_network_sense.main import app
          assert "/health" in app.openapi()["paths"]
          for widget in ("sense-energy-flow", "sense-device-breakdown"):
              assert (Path("/app/widgets") / widget / "dist/widget.js").is_file()
          '
      - name: Read validated image name
        id: release
        run: |
          python -c 'import json,os; m=json.load(open("manifest.json")); print("image=" + m["image"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to Docker Hub with OIDC
        uses: docker/login-action@v4.5.0
        with:
          username: piphinetwork
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Publish runtime with widgets
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}
      - name: Package dashboard assets
        run: |
          tar -czf sense-widgets.tar.gz \
            widgets/sense-energy-flow/{dist,previews,widget.manifest.json,README.md} \
            widgets/sense-device-breakdown/{dist,previews,widget.manifest.json,README.md}
      - name: Create reviewable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          gh release create "$RELEASE_REF" manifest.json src/behaviors.json sense-widgets.tar.gz
          --verify-tag --prerelease --title "Sense Energy $RELEASE_REF"
          --notes "Runtime: $IMAGE at $IMAGE_DIGEST. Registry status remains draft; runtime qualification remains unverified."
