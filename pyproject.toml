[project]
name = "piphi-network-sense"
version = "0.1.0"
description = "PiPhi Network integration for the Sense Energy Monitor."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.7.1,<1.0.0",
  "sense-energy>=0.14.3,<0.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]


[project.scripts]
piphi_network_sense = "piphi_network_sense.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_sense"]
